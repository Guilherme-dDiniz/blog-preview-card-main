<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsivo.css">
  
  <title>Frontend Mentor | Blog preview card</title>
</head>
<body>

  <main class="container">
    <section class="card">
      <img src="./assets/images/illustration-article.svg" alt="ilustração">
      <div class="informacoes">
        <h4 class="tipo">Learning</h4>
        <h4 class="data-da-publicacao"> Published 21 Dec 2023</h4>
        <a class="titulo-do-card" href="#">HTML & CSS foundations</a>
        <p class="sobre">These languages are the backbone of every website, defining structure, content, and presentation.</p>
      </div>

      <div class="autor">
        <img class="foto-do-autor" src="./assets/images/image-avatar.webp" alt="foto do autor">
        <h4 class="nome-autor">Greg Hooper</h4>
      </div>
    </section>
  </main>

</body>
</html>
